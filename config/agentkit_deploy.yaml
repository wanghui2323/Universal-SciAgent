# AgentKit Deployment Configuration for Universal-SciAgent
# Deploy to Volcengine AgentKit Runtime
# Reference: https://github.com/volcengine/agentkit-sdk-python

name: universal-sciagent
version: 1.0.0
description: Universal Scientific Research Agent Platform

# Runtime Configuration
runtime:
  python_version: "3.10"
  memory: 2048  # MB
  timeout: 600  # seconds (10 minutes)

# Environment Variables
environment:
  MODEL_AGENT_NAME: ${MODEL_AGENT_NAME}  # Your Endpoint ID (ep-xxx)
  MODEL_AGENT_API_KEY: ${MODEL_AGENT_API_KEY}
  MODEL_AGENT_API_BASE: "https://ark.cn-beijing.volces.com/api/v3/"
  MODEL_AGENT_PROVIDER: "openai"
  CHROMA_PERSIST_DIR: "/tmp/chromadb"
  LOG_DIR: "/tmp/logs"
  MAX_COST_PER_TASK: "2.0"
  MAX_PAPERS_PER_SEARCH: "20"

# Dependencies
dependencies:
  - veadk-python>=0.2.28
  - agentkit-sdk-python>=0.2.0
  - arxiv>=2.1.0
  - chromadb>=0.4.22
  - pandas>=2.1.0
  - pydantic>=2.5.0
  - pydantic-settings>=2.2.1
  - pyyaml>=6.0.1
  - pypdf2>=3.0.0
  - requests>=2.31.0
  - aiohttp>=3.9.0
  - python-dotenv>=1.0.0
  - tqdm>=4.66.0
  - tenacity>=8.2.0

# Entry Point
entrypoint:
  module: backend.deploy.agentkit_handler
  handler: handler

# API Endpoints
endpoints:
  - path: /literature-review
    method: POST
    description: Generate literature review
    parameters:
      - name: keywords
        type: array
        required: true
      - name: domain
        type: array
        required: true
      - name: max_papers
        type: integer
        default: 20
      - name: time_range
        type: array
        required: false

  - path: /hypothesis-generation
    method: POST
    description: Generate research hypotheses
    parameters:
      - name: keywords
        type: array
        required: true
      - name: domain
        type: array
        required: true
      - name: num_hypotheses
        type: integer
        default: 3
      - name: max_papers
        type: integer
        default: 20

  - path: /domains
    method: GET
    description: List available research domains

# Resource Limits
resources:
  cpu: 2
  memory: 2048
  disk: 5120  # MB

# Scaling Configuration
scaling:
  min_instances: 1
  max_instances: 5
  target_cpu_utilization: 70

# Monitoring & Logging
monitoring:
  enabled: true
  log_level: INFO
  metrics:
    - request_count
    - request_duration
    - error_rate
    - cost_per_request

# Health Check
health_check:
  path: /health
  interval: 30
  timeout: 5
  unhealthy_threshold: 3

# File Includes
include:
  - backend/
  - config/
  - requirements.txt

# File Excludes
exclude:
  - notebooks/
  - tests/
  - data/chromadb/*
  - data/logs/*
  - "*.pyc"
  - __pycache__/
  - .git/
  - .env

