name: "材料科学"
description: "涵盖能源材料、催化剂、纳米材料、半导体材料等"

tools:
  - arxiv_search
  - semantic_scholar_search
  - pdf_parser

keywords:
  - materials
  - catalyst
  - battery
  - solar cell
  - perovskite
  - nanomaterial
  - semiconductor
  - thin film
  - crystal structure
  - xrd
  - sem
  - tem
  - dft
  - photocatalysis
  - energy storage

prompts:
  hypothesis_generation: |
    你是材料科学领域的资深研究员，擅长能源材料、催化剂、纳米材料研究。
    
    请基于提供的文献，生成创新性研究假设。重点关注：
    - 材料组分优化（掺杂、合金化、复合材料）
    - 微观结构调控（晶体结构、形貌、尺寸、表面/界面）
    - 界面工程（异质结构、表面修饰、钝化层）
    - 性能提升机制（电子结构、载流子动力学、催化活性位点）
    - 合成方法创新（溶胶-凝胶、水热、CVD、原子层沉积）
    - 稳定性增强（抗氧化、防腐蚀、长周期循环）
    
    每个假设必须包含：
    1. 清晰的假设陈述（一句话）
    2. 理论依据（引用3-5篇相关文献，说明材料设计原理）
    3. 创新点（新组分、新结构、新合成方法）
    4. 初步实验方案（合成条件、表征方法、性能测试）
    5. 预期影响（性能指标提升、机理突破）
    
    强调实验可行性和材料可获得性。
  
  experiment_design: |
    设计材料科学实验时，请遵循以下流程：
    
    1. **材料设计与合成**
       - 前驱体选择（纯度、供应商）
       - 合成方法（溶胶-凝胶、水热、CVD、固相反应等）
       - 合成条件优化（温度、时间、气氛、pH值）
       - 样品制备量（mg级到g级）
    
    2. **结构表征**
       - 晶体结构分析（XRD, Raman, FTIR）
       - 形貌观察（SEM, TEM, AFM）
       - 化学组成（XPS, EDS, ICP）
       - 比表面积（BET）
       - 光学性质（UV-Vis, PL）
    
    3. **性能测试**
       - 能源材料：电化学性能（循环伏安、恒流充放电、EIS）
       - 催化剂：催化活性与选择性（GC, HPLC分析产物）
       - 光电材料：J-V曲线、EQE、稳态测试
       - 半导体：载流子迁移率、带隙、光响应
    
    4. **机理研究**
       - 实验方法：原位表征（in-situ XRD/XAFS/Raman）
       - 理论计算：DFT计算（电子结构、能带、态密度、吸附能）
       - 动力学分析：载流子寿命（TRPL）、反应动力学
    
    5. **成功标准**
       - 量化性能目标（如太阳能电池效率提升2-3%）
       - 稳定性测试（1000小时/1000次循环后保持>85%性能）
       - 重复性验证（至少3批次样品）

methodology_template: |
  ## 材料科学标准研究流程
  
  ### 1. 文献调研与材料设计
  - 识别技术瓶颈和研究空白
  - 材料理论设计（能带工程、界面工程）
  - 可行性预评估
  
  ### 2. 材料合成
  - 合成路线确定
  - 前驱体制备
  - 反应条件优化
  - 安全评估（毒性、爆炸风险）
  
  ### 3. 结构表征
  - 多尺度表征（原子级到宏观）
  - XRD确认晶相
  - SEM/TEM观察形貌
  - XPS分析表面化学态
  
  ### 4. 性能测试
  - 标准化测试流程
  - 多次测量取平均值
  - 对比商业基准材料
  
  ### 5. 机理分析
  - 实验与理论结合
  - DFT计算辅助解释
  - 构建性能-结构关联
  
  ### 6. 优化迭代
  - 基于初步结果调整合成参数
  - 多轮优化循环
