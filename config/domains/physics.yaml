name: "物理学"
description: "涵盖凝聚态物理、量子物理、光学、粒子物理等"

tools:
  - arxiv_search
  - semantic_scholar_search
  - pdf_parser

keywords:
  - physics
  - quantum
  - condensed matter
  - superconductor
  - topological
  - optics
  - laser
  - photonics
  - magnetism
  - spintronics
  - quantum computing
  - plasma
  - cosmology
  - particle physics

prompts:
  hypothesis_generation: |
    你是物理学领域的资深研究员，擅长凝聚态物理、量子物理、光学等方向。
    
    请基于提供的文献，生成创新性研究假设。重点关注：
    - 新物态发现（拓扑绝缘体、超导、量子自旋液体）
    - 量子现象（量子纠缠、量子相变、量子输运）
    - 光与物质相互作用（非线性光学、超快光学、等离激元）
    - 新型器件（量子比特、自旋电子学器件、光子器件）
    - 理论模型（有效哈密顿量、场论、数值模拟）
    - 实验技术（扫描探针、超快光谱、低温物性测量）
    
    每个假设必须包含：
    1. 清晰的假设陈述（一句话）
    2. 理论依据（引用3-5篇相关文献，说明物理原理）
    3. 创新点（新现象、新机制、新应用）
    4. 初步实验方案（样品制备、测量方法、理论计算）
    5. 预期影响（物理学意义、应用前景）
    
    强调理论自洽性和实验可验证性。
  
  experiment_design: |
    设计物理学实验时，请遵循以下流程：
    
    1. **样品制备**
       - 材料生长（MBE, PLD, CVD, 单晶生长）
       - 微纳加工（光刻、蚀刻、薄膜沉积）
       - 样品表征（成分、结构、纯度）
    
    2. **物性测量**
       - 电学性质（电阻、霍尔效应、I-V特性）
       - 磁学性质（磁化率、磁滞回线、磁输运）
       - 光学性质（吸收光谱、荧光、拉曼）
       - 热学性质（比热、热导率）
       - 极端条件（低温、高压、强磁场）
    
    3. **光谱学研究**
       - 稳态光谱（吸收、发射、散射）
       - 超快光谱（泵浦-探测、时间分辨）
       - 角分辨光电子能谱（ARPES）
       - X射线散射/吸收（XRD, XAFS）
    
    4. **理论计算**
       - 第一性原理计算（DFT, DMFT）
       - 数值模拟（蒙特卡罗、精确对角化、DMRG）
       - 解析理论（微扰论、场论、重整化群）
    
    5. **成功标准**
       - 观测到预期的物理现象（相变温度、能隙、拓扑性质）
       - 实验与理论定量符合
       - 可重复性验证（多个样品、不同实验室）

methodology_template: |
  ## 物理学标准研究流程
  
  ### 1. 理论预测与文献调研
  - 理论模型构建
  - 文献调研识别关键问题
  - 可行性分析
  
  ### 2. 样品制备
  - 高质量单晶/薄膜生长
  - 微纳器件加工
  - 样品表征确认
  
  ### 3. 实验测量
  - 多种物性测量技术
  - 极端条件下测量
  - 系统性参数扫描
  
  ### 4. 数据分析
  - 数据拟合与模型提取
  - 误差分析
  - 与理论对比
  
  ### 5. 理论解释
  - 构建物理图像
  - 理论计算支持
  - 预测新现象
  
  ### 6. 可重复性验证
  - 多个独立样品测量
  - 不同实验技术交叉验证
