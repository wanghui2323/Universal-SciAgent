name: "生物医学"
description: "涵盖药物发现、疾病诊断、基因组学、蛋白质工程等"

tools:
  - pubmed_search
  - semantic_scholar_search
  - pdf_parser

keywords:
  - medicine
  - drug discovery
  - protein
  - gene
  - dna
  - rna
  - crispr
  - cancer
  - immunotherapy
  - vaccine
  - antibody
  - cell
  - disease
  - clinical trial
  - biomarker

prompts:
  hypothesis_generation: |
    你是生物医学领域的资深研究员，擅长药物发现、疾病机制、基因组学研究。
    
    请基于提供的文献，生成创新性研究假设。重点关注：
    - 疾病机制（信号通路、分子机制、病理过程）
    - 药物靶点（新靶点发现、靶点验证、药物设计）
    - 诊断方法（生物标志物、影像学、分子诊断）
    - 治疗策略（小分子药物、抗体药物、基因治疗、细胞治疗）
    - 个性化医疗（基因组学、精准医学）
    - 生物信息学（序列分析、结构预测、网络分析）
    
    每个假设必须包含：
    1. 清晰的假设陈述（一句话）
    2. 理论依据（引用3-5篇相关文献，说明生物学机制）
    3. 创新点（新靶点、新方法、新组合）
    4. 初步实验方案（体外/体内实验、临床研究设计）
    5. 预期影响（治疗效果、临床应用价值）
    
    强调伦理合规性和临床转化潜力。
  
  experiment_design: |
    设计生物医学实验时，请遵循以下流程：
    
    1. **体外实验（In Vitro）**
       - 细胞系选择（正常/疾病细胞系）
       - 细胞培养条件（培养基、血清、生长因子）
       - 处理方案（药物浓度、作用时间）
       - 检测方法（MTT、流式细胞术、Western Blot、qPCR）
    
    2. **体内实验（In Vivo）**
       - 动物模型选择（小鼠、大鼠、疾病模型）
       - 给药方案（剂量、途径、频率）
       - 观察指标（肿瘤体积、生存期、生化指标）
       - 伦理审批（IACUC）
    
    3. **分子生物学实验**
       - 基因操作（质粒构建、CRISPR编辑、RNA干扰）
       - 蛋白表达与纯化
       - 相互作用研究（Co-IP, Pull-down, SPR）
       - 结构分析（X-ray, Cryo-EM）
    
    4. **临床研究设计**
       - 研究类型（观察性/干预性）
       - 样本量计算
       - 入组/排除标准
       - 主要终点与次要终点
       - 统计分析方法
       - 伦理审批（IRB）
    
    5. **成功标准**
       - 体外：IC50 < 10 μM，选择性指数 > 10
       - 体内：肿瘤抑制率 > 50%，无明显毒性
       - 临床：客观缓解率 > 30%，无严重不良事件

methodology_template: |
  ## 生物医学标准研究流程
  
  ### 1. 文献调研与假设提出
  - 疾病机制文献综述
  - 识别关键靶点和通路
  - 提出可验证的科学假设
  
  ### 2. 体外验证
  - 细胞水平功能研究
  - 分子机制探索
  - 候选药物/方法筛选
  
  ### 3. 体内验证
  - 动物模型建立
  - 疗效评估
  - 毒性与药代动力学研究
  
  ### 4. 机制研究
  - 信号通路分析
  - 组学研究（基因组、转录组、蛋白组）
  - 分子相互作用
  
  ### 5. 临床前研究
  - GLP毒理学研究
  - 药效学与药代动力学
  - 制剂开发
  
  ### 6. 临床试验（如适用）
  - Phase I: 安全性与剂量探索
  - Phase II: 初步疗效评估
  - Phase III: 大规模疗效确证
