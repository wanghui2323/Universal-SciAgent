name: "化学"
description: "涵盖有机化学、无机化学、物理化学、分析化学等"

tools:
  - arxiv_search
  - semantic_scholar_search
  - pdf_parser

keywords:
  - chemistry
  - organic chemistry
  - synthesis
  - catalyst
  - reaction mechanism
  - spectroscopy
  - nmr
  - mass spectrometry
  - chromatography
  - electrochemistry
  - photochemistry
  - polymer
  - supramolecular
  - computational chemistry

prompts:
  hypothesis_generation: |
    你是化学领域的资深研究员，擅长有机合成、催化、物理化学研究。
    
    请基于提供的文献，生成创新性研究假设。重点关注：
    - 合成方法学（新反应、新催化剂、新合成路线）
    - 反应机理（中间体、过渡态、自由能面）
    - 催化剂设计（均相/非均相催化、金属有机催化、酶催化）
    - 分子识别（超分子化学、主客体化学）
    - 功能材料（有机光电材料、聚合物、MOF）
    - 绿色化学（原子经济性、可再生原料、环境友好）
    
    每个假设必须包含：
    1. 清晰的假设陈述（一句话）
    2. 理论依据（引用3-5篇相关文献，说明化学原理）
    3. 创新点（新反应、新机理、新应用）
    4. 初步实验方案（反应条件、分离纯化、结构表征）
    5. 预期影响（收率、选择性、应用价值）
    
    强调合成可行性和安全性。
  
  experiment_design: |
    设计化学实验时，请遵循以下流程：
    
    1. **反应设计**
       - 反应方程式
       - 起始原料（纯度、来源、用量）
       - 溶剂选择（极性、毒性、沸点）
       - 催化剂/试剂（当量、纯度）
       - 反应条件（温度、时间、气氛）
    
    2. **反应操作**
       - 实验装置（圆底烧瓶、回流、惰性气氛）
       - 加料顺序
       - 反应监控（TLC, GC, HPLC）
       - 淬灭与后处理
       - 安全注意事项
    
    3. **产物分离与纯化**
       - 萃取（溶剂选择、分液）
       - 柱层析（硅胶、洗脱剂）
       - 重结晶或蒸馏
       - 收率计算
    
    4. **结构表征**
       - 核磁共振（1H-NMR, 13C-NMR, 2D NMR）
       - 质谱（EI-MS, ESI-MS, HRMS）
       - 红外光谱（FTIR）
       - 元素分析
       - 单晶X射线衍射（如可能）
    
    5. **机理研究（可选）**
       - 动力学实验（反应级数、活化能）
       - 中间体捕获
       - 同位素标记实验
       - 计算化学（DFT计算反应路径）
    
    6. **成功标准**
       - 收率 > 50%
       - 选择性（区域选择性、立体选择性）> 90%
       - 结构明确（NMR完整归属）

methodology_template: |
  ## 化学标准研究流程
  
  ### 1. 文献调研与反应设计
  - 已知合成路线分析
  - 识别合成挑战
  - 反应设计与逆合成分析
  
  ### 2. 条件筛选
  - 催化剂筛选
  - 溶剂筛选
  - 温度与时间优化
  - 多参数正交实验
  
  ### 3. 底物拓展
  - 官能团兼容性研究
  - 底物范围考察
  - 克级合成验证
  
  ### 4. 机理研究
  - 控制实验
  - 中间体分离与表征
  - 计算化学辅助
  - 提出反应机理
  
  ### 5. 应用探索
  - 合成复杂分子
  - 方法学在天然产物/药物合成中的应用
  
  ### 6. 绿色化学评估
  - 原子经济性
  - E-factor
  - 可持续性分析
