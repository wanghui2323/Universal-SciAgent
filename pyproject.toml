[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-sciagent"
version = "1.0.0"
description = "Universal Scientific Research Agent Platform powered by VeADK"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Universal-SciAgent Contributors"}
]
keywords = [
    "agent", "ai", "scientific-research", "multi-agent",
    "veadk", "agentkit", "literature-review", "volcengine"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "veadk-python>=0.2.27",
    "agentkit-sdk-python>=0.2.0",
    "arxiv>=2.1.0",
    "chromadb>=0.4.22,<0.5.0",
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.10.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.7.0",
    "isort>=5.12.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipython>=8.18.0",
    "ipywidgets>=8.1.0",
]
viz = [
    "plotly>=5.18.0,<6.0.0",
    "matplotlib>=3.8.0,<4.0.0",
]
all = ["universal-sciagent[dev,notebook,viz]"]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/universal-sciagent"
Documentation = "https://github.com/YOUR_USERNAME/universal-sciagent#readme"
Repository = "https://github.com/YOUR_USERNAME/universal-sciagent.git"
Issues = "https://github.com/YOUR_USERNAME/universal-sciagent/issues"
Changelog = "https://github.com/YOUR_USERNAME/universal-sciagent/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.black]
line-length = 127
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 127

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", "venv/*"]
